    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit-1&2:HTML Fundamentals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Roboto", -apple-system, "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: #f2f6fb;
            color: #111;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .quiz-container h1 {
            text-align: center;
            font-size: 26px;
            letter-spacing: -0.4px;
            margin: 10px 0 20px;
        }

        .quiz-container .timer {
            font-weight: bold;
            text-align: right;
            font-size: 18px;
            margin-bottom: 16px;
        }

        .timer.danger {
            color: red;
        }

        .quiz-container h2.question {
            font-size: 20px;
            background-color: #d0ecff;
            padding: 18px;
            border-radius: 8px;
            font-weight: normal;
            line-height: 1.6;
            margin: 0 0 20px;
        }

        .question-number {
            font-size: 15px;
            margin-right: 12px;
            background: #1d3557;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            white-space: nowrap;
            vertical-align: middle;
        }

        .quiz-container .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .quiz-container .option {
            border: none;
            padding: 22px 24px;
            font-size: 17px;
            background: yellow;
            cursor: pointer;
            border-radius: 6px;
            text-align: left;
            line-height: 1.4;
            color: #222;
            transition: filter .12s;
            position: relative;
        }

        .quiz-container .option:hover:not(.disabled) {
            filter: brightness(0.95);
        }

        .disabled {
            pointer-events: none;
            opacity: 0.75;
        }

        .option.correct {
            background-color: #51e351;
            color: #222;
        }

        .option.incorrect {
            background: #e63946;
            color: #fff;
        }

        /* ---------- correct-answer celebration ---------- */
        .celebrate {
            position: absolute;
            top: 8px;
            right: 10px;
            transform: rotate(8deg);
            background: #fff;
            color: #1d3557;
            border: 2.5px solid #f5b50a;
            border-radius: 999px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 6px 12px;
            box-shadow: 0 6px 18px rgba(45, 106, 79, .35);
            animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) forwards;
            z-index: 5;
            white-space: nowrap;
        }
        .celebrate .cracker-emoji { font-size: 18px; display: inline-block; animation: wiggle .6s ease-in-out infinite; }

        @keyframes pop {
            0%   { transform: rotate(8deg) scale(0); }
            60%  { transform: rotate(-4deg) scale(1.3); }
            100% { transform: rotate(8deg) scale(1); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50%      { transform: rotate(20deg) scale(1.25); }
        }
        .crackers {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 20px;
            letter-spacing: 3px;
            animation: cracker 1s ease-in-out infinite;
            pointer-events: none;
            z-index: 6;
        }
        @keyframes cracker {
            0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            50%  { transform: translateY(-14px) rotate(18deg) scale(1.2); opacity: .85; }
            100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
        }
        .confetti {
            position: fixed;
            top: -12px;
            font-size: 18px;
            pointer-events: none;
            z-index: 1000;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(720deg); opacity: .2; }
        }

        .fib-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            max-width: 720px;
        }

        .fib-row input {
            flex: 1;
            border: none;
            padding: 20px 22px;
            font-size: 17px;
            background: yellow;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
            color: #222;
        }

        .fib-row input:focus {
            outline: 3px solid #ffd700;
        }

        .fib-row input.correct {
            background: #51e351;
        }

        .fib-row input.incorrect {
            background: #e63946;
            color: #fff;
        }

        .fib-row .fib-submit {
            background: #222;
            color: #fff;
            border: none;
            padding: 12px 26px;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 6px;
        }

        .quiz-container .next-btn,
        .quiz-result .retake-btn {
            background: #222;
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 20px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            width: fit-content;
            display: inline-block;
        }

        .quiz-container .next-btn {
            margin: 0 auto;
            display: block;
        }

        .nav-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            max-width: 760px;
            margin: 0 auto;
        }

        .nav-row .next-btn {
            flex: 1;
            max-width: 300px;
            width: auto;
        }

        .next-btn.prev {
            background: #3a4a5a;
        }

        .next-btn.prev:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- result page ---------- */
        .quiz-result {
            display: none;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            text-align: center;
            color: #dd2e00;
        }

        .quiz-result h2 {
            margin: 6px 0 0;
            font-size: 26px;
        }

        .quiz-result h3 {
            margin: 0;
            color: #1d3557;
            font-size: 20px;
        }

        .result-legend {
            font-size: 14px;
            color: #333;
            display: flex;
            justify-content: center;
            gap: 22px;
            align-items: center;
        }

        .result-legend span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
        }

        .dot.g { background: #51e351; }
        .dot.r { background: #e63946; }
        .dot.w { background: #fff; border: 2px solid #aaa; }

        .question-container {
            text-align: left;
            border: 1.5px solid #dddddd;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fff;
            color: #222;
        }

        .question-container.correct-item {
            background: #2ecc40;
            border: none;
            color: #fff;
        }

        .question-container.incorrect-item {
            background: #e63946;
            border: none;
            color: #fff;
        }

        .question-container .question {
            font-weight: 600;
            line-height: 1.5;
        }

        .question-container .qno {
            background: #1d3557;
            color: #fff;
            padding: 3px 9px;
            border-radius: 7px;
            font-size: 13px;
            margin-right: 8px;
        }

        .question-container.correct-item .user-answer,
        .question-container.correct-item .correct-answer,
        .question-container.incorrect-item .user-answer,
        .question-container.incorrect-item .correct-answer {
            color: #fff;
        }

        .question-container .user-answer,
        .question-container .correct-answer {
            font-size: 14px;
        }

        .user-answer.good {
            color: #fff;
            font-weight: 700;
        }

        .user-answer.bad {
            color: #fff;
            font-weight: 700;
        }

        .user-answer.muted {
            color: #666;
            font-weight: 600;
            font-style: italic;
        }

        .correct-answer {
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }

        .quiz-result .retake-btn {
            margin: 10px auto;
        }

        footer {
            text-align: center;
            color: #7c8a99;
            font-size: 12px;
            padding-bottom: 20px;
        }

        @media (max-width: 700px) {
            .quiz-container .options {
                grid-template-columns: 1fr;
            }
            .fib-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<div class="quiz-container">
    <h1>Unit-1 & 2: HTML Fundamentals</h1>
    <div class="timer">Time Left: 00:00</div>

    <div class="options"></div>

        <input type="text" id="fibInput" placeholder="Type your answer here..." autocomplete="off">
        <button class="fib-submit" id="fibSubmit">Check</button>
    </div>
    <div class="nav-row">
        <button class="next-btn prev" id="prevBtn">Previous</button>
        <button class="next-btn" id="nextBtn">Next</button>
    </div>
</div>

<div class="quiz-result"></div>

<footer>HTML Fundamentals — 400-question interactive bank (Chapters 1–13 + In-Depth)</footer>

<script>
const QUESTIONS = [
{"n": 1, "t": "What is defined as the global physical network of networks?", "type": "mc", "opts": [{"l": "A", "t": "World Wide Web"}, {"l": "B", "t": "The Internet"}, {"l": "C", "t": "Hypertext Transfer Protocol"}, {"l": "D", "t": "Domain Name System"}], "ans": "B", "anst": "The Internet"},
{"n": 2, "t": "The Internet links networks using which array of technologies?", "type": "mc", "opts": [{"l": "A", "t": "Electronic, wireless, and optical"}, {"l": "B", "t": "Magnetic and mechanical only"}, {"l": "C", "t": "Acoustic and manual relay"}, {"l": "D", "t": "Purely satellite-based protocols"}], "ans": "A", "anst": "Electronic, wireless, and optical"},
{"n": 3, "t": "Which service running on the Internet is responsible for email transmission?", "type": "mc", "opts": [{"l": "A", "t": "FTP"}, {"l": "B", "t": "SMTP"}, {"l": "C", "t": "HTTP"}, {"l": "D", "t": "DNS"}], "ans": "B", "anst": "SMTP"},
{"n": 4, "t": "What does the acronym FTP stand for?", "type": "mc", "opts": [{"l": "A", "t": "File Transfer Protocol"}, {"l": "B", "t": "Fast Transmission Protocol"}, {"l": "C", "t": "Format Text Process"}, {"l": "D", "t": "File Tracking Provider"}], "ans": "A", "anst": "File Transfer Protocol"},
{"n": 5, "t": "What is the World Wide Web (WWW)?", "type": "mc", "opts": [{"l": "A", "t": "The physical cables connecting servers"}, {"l": "B", "t": "An operating system for servers"}, {"l": "C", "t": "A system of interconnected documents and resources linked by hyperlinks and URLs"}, {"l": "D", "t": "A private intranet for academic organizations"}], "ans": "C", "anst": "A system of interconnected documents and resources linked by hyperlinks and URLs"},
{"n": 6, "t": "How are resources identified within the World Wide Web?", "type": "mc", "opts": [{"l": "A", "t": "MAC addresses"}, {"l": "B", "t": "Uniform Resource Locators (URLs)"}, {"l": "C", "t": "Port forward numbers"}, {"l": "D", "t": "File allocation tables"}], "ans": "B", "anst": "Uniform Resource Locators (URLs)"},
{"n": 7, "t": "What software application is primarily used to access the World Wide Web?", "type": "mc", "opts": [{"l": "A", "t": "Web browser"}, {"l": "B", "t": "Text compiler"}, {"l": "C", "t": "Database engine"}, {"l": "D", "t": "Operating system kernel"}], "ans": "A", "anst": "Web browser"},
{"n": 8, "t": "Which of the following is NOT an example of a web browser?", "type": "mc", "opts": [{"l": "A", "t": "Google Chrome"}, {"l": "B", "t": "Mozilla Firefox"}, {"l": "C", "t": "Apache HTTP Server"}, {"l": "D", "t": "Apple Safari"}], "ans": "C", "anst": "Apache HTTP Server"},
{"n": 9, "t": "What are the three core technologies that form the modern web triad?", "type": "mc", "opts": [{"l": "A", "t": "Python, SQL, and C++"}, {"l": "B", "t": "HTML, CSS, and JavaScript"}, {"l": "C", "t": "HTTP, FTP, and SMTP"}, {"l": "D", "t": "XML, JSON, and PHP"}], "ans": "B", "anst": "HTML, CSS, and JavaScript"},
{"n": 10, "t": "What is the primary role of HTML in the web triad?", "type": "mc", "opts": [{"l": "A", "t": "Behavior and interactivity"}, {"l": "B", "t": "Visual presentation and styling"}, {"l": "C", "t": "Structure and content layer"}, {"l": "D", "t": "Database persistence"}], "ans": "C", "anst": "Structure and content layer"},
{"n": 11, "t": "What does the acronym HTML stand for?", "type": "mc", "opts": [{"l": "A", "t": "HyperText Markup Language"}, {"l": "B", "t": "High Transfer Machine Language"}, {"l": "C", "t": "Hyperlink Text Management Line"}, {"l": "D", "t": "Hyper Transfer Mode Language"}], "ans": "A", "anst": "HyperText Markup Language"},
{"n": 12, "t": "Which layer of the web triad does CSS represent?", "type": "mc", "opts": [{"l": "A", "t": "Structural layer"}, {"l": "B", "t": "Presentation or style layer"}, {"l": "C", "t": "Behavioral layer"}, {"l": "D", "t": "Network transport layer"}], "ans": "B", "anst": "Presentation or style layer"},
{"n": 13, "t": "What does CSS define on a webpage?", "type": "mc", "opts": [{"l": "A", "t": "How content looks (colors, fonts, layout, spacing)"}, {"l": "B", "t": "The semantic definition of headings"}, {"l": "C", "t": "Server-side routing rules"}, {"l": "D", "t": "Database queries"}], "ans": "A", "anst": "How content looks (colors, fonts, layout, spacing)"},
{"n": 14, "t": "What layer of the web triad does JavaScript govern?", "type": "mc", "opts": [{"l": "A", "t": "Network protocol layer"}, {"l": "B", "t": "Data serialization layer"}, {"l": "C", "t": "Presentation layer"}, {"l": "D", "t": "Behavior or interactivity layer"}], "ans": "D", "anst": "Behavior or interactivity layer"},
{"n": 15, "t": "What capability does JavaScript provide to a webpage?", "type": "mc", "opts": [{"l": "A", "t": "Allows the page to respond to user actions and change dynamically without reloading"}, {"l": "B", "t": "Transmits physical optical signals through glass fibers"}, {"l": "C", "t": "Connects the client physically to the local router"}, {"l": "D", "t": "Formats pure text files into PDF documents"}], "ans": "A", "anst": "Allows the page to respond to user actions and change dynamically without reloading"},
{"n": 16, "t": "Why is understanding HTML considered the critical first step in web development?", "type": "mc", "opts": [{"l": "A", "t": "Because CSS can compile without any markup"}, {"l": "B", "t": "Because without a sound structure, CSS cannot style properly and JavaScript cannot manipulate effectively"}, {"l": "C", "t": "Because JavaScript replaces HTML completely during runtime"}, {"l": "D", "t": "Because browsers reject websites that have CSS without HTML"}], "ans": "B", "anst": "Because without a sound structure, CSS cannot style properly and JavaScript cannot manipulate effectively"},
{"n": 17, "t": "Can CSS function effectively without a sound HTML structure?", "type": "mc", "opts": [{"l": "A", "t": "Yes, CSS generates its own structural tree"}, {"l": "B", "t": "No, styling requires structural elements to target"}, {"l": "C", "t": "Yes, if written using external stylesheets"}, {"l": "D", "t": "Only in older versions of HTML"}], "ans": "B", "anst": "No, styling requires structural elements to target"},
{"n": 18, "t": "Are the terms \"Internet\" and \"World Wide Web\" interchangeable?", "type": "mc", "opts": [{"l": "A", "t": "Yes, they are synonymous"}, {"l": "B", "t": "No, the Web is one of many services running on the Internet infrastructure"}, {"l": "C", "t": "Yes, since the release of HTML5"}, {"l": "D", "t": "No, the Internet was built on top of the Web"}], "ans": "B", "anst": "No, the Web is one of many services running on the Internet infrastructure"},
{"n": 19, "t": "Which technology in the triad specifies whether a piece of content is a heading, paragraph, or image?", "type": "mc", "opts": [{"l": "A", "t": "JavaScript"}, {"l": "B", "t": "CSS"}, {"l": "C", "t": "HTML"}, {"l": "D", "t": "HTTP"}], "ans": "C", "anst": "HTML"},
{"n": 20, "t": "What is the main function of client-side web browsers like Chrome, Firefox, and Edge?", "type": "mc", "opts": [{"l": "A", "t": "Hosting backend databases"}, {"l": "B", "t": "Serving web pages to thousands of concurrent users"}, {"l": "C", "t": "Accessing and rendering web resources for users"}, {"l": "D", "t": "Assigning IP addresses to domain names"}], "ans": "C", "anst": "Accessing and rendering web resources for users"},
{"n": 21, "t": "What fundamental architectural model defines information exchange on the web?", "type": "mc", "opts": [{"l": "A", "t": "Peer-to-Peer architecture"}, {"l": "B", "t": "Client-Server architecture"}, {"l": "C", "t": "Master-Worker model"}, {"l": "D", "t": "Model-View-Controller architecture"}], "ans": "B", "anst": "Client-Server architecture"},
{"n": 22, "t": "In the client-server model, what is the \"client\"?", "type": "mc", "opts": [{"l": "A", "t": "The data center housing server blades"}, {"l": "B", "t": "The device or application making a request for information"}, {"l": "C", "t": "The ISP hosting broadband lines"}, {"l": "D", "t": "The backend SQL database"}], "ans": "B", "anst": "The device or application making a request for information"},
{"n": 23, "t": "In the context of the web, what is almost always the client?", "type": "mc", "opts": [{"l": "A", "t": "The web browser"}, {"l": "B", "t": "The domain registrar"}, {"l": "C", "t": "The physical fiber switch"}, {"l": "D", "t": "The Apache web server"}], "ans": "A", "anst": "The web browser"},
{"n": 24, "t": "What is the \"server\" in the client-server architecture?", "type": "mc", "opts": [{"l": "A", "t": "An application running on mobile devices to render HTML"}, {"l": "B", "t": "A computer that stores and serves website resources when requested"}, {"l": "C", "t": "A browser extension used for web caching"}, {"l": "D", "t": "The peripheral input device operated by the end user"}], "ans": "B", "anst": "A computer that stores and serves website resources when requested"},
{"n": 25, "t": "What protocol governs the communication between client and server?", "type": "mc", "opts": [{"l": "A", "t": "SMTP"}, {"l": "B", "t": "FTP"}, {"l": "C", "t": "HTTP"}, {"l": "D", "t": "SSH"}], "ans": "C", "anst": "HTTP"},
{"n": 26, "t": "What is the cyclic communication process between client and server called?", "type": "mc", "opts": [{"l": "A", "t": "Handshake loop"}, {"l": "B", "t": "Request-Response Cycle"}, {"l": "C", "t": "Compilation-Execution Cycle"}, {"l": "D", "t": "Fetch-Decode Cycle"}], "ans": "B", "anst": "Request-Response Cycle"},
{"n": 27, "t": "What initiates the Request-Response Cycle?", "type": "mc", "opts": [{"l": "A", "t": "The server pushing updates without connection"}, {"l": "B", "t": "A user action such as typing a URL or clicking a link"}, {"l": "C", "t": "A DNS background refresh"}, {"l": "D", "t": "A browser shutting down"}], "ans": "B", "anst": "A user action such as typing a URL or clicking a link"},
{"n": 28, "t": "Which component formulates the initial HTTP Request?", "type": "mc", "opts": [{"l": "A", "t": "The web server"}, {"l": "B", "t": "The database engine"}, {"l": "C", "t": "The browser (client)"}, {"l": "D", "t": "The DNS authoritative server"}], "ans": "C", "anst": "The browser (client)"},
{"n": 29, "t": "What essential components are contained in an HTTP Request?", "type": "mc", "opts": [{"l": "A", "t": "Server IP address and database credentials"}, {"l": "B", "t": "Resource URL, request method (e.g., GET/POST), and metadata"}, {"l": "C", "t": "Compiled binary bytecode and machine instructions"}, {"l": "D", "t": "Complete rendered DOM tree"}], "ans": "B", "anst": "Resource URL, request method (e.g., GET/POST), and metadata"},
{"n": 30, "t": "What HTTP method is typically used to retrieve data from a server?", "type": "mc", "opts": [{"l": "A", "t": "PUSH"}, {"l": "B", "t": "GET"}, {"l": "C", "t": "FETCH"}, {"l": "D", "t": "SEND"}], "ans": "B", "anst": "GET"},
{"n": 31, "t": "What HTTP method is commonly used to send data such as form submissions?", "type": "mc", "opts": [{"l": "A", "t": "GET"}, {"l": "B", "t": "POST"}, {"l": "C", "t": "RETRIEVE"}, {"l": "D", "t": "PULL"}], "ans": "B", "anst": "POST"},
{"n": 32, "t": "What system does the browser use to translate a domain name into a server's IP address?", "type": "mc", "opts": [{"l": "A", "t": "Domain Name System (DNS)"}, {"l": "B", "t": "Dynamic Host Control"}, {"l": "C", "t": "Address Resolution Protocol"}, {"l": "D", "t": "Universal Resource Identifier"}], "ans": "A", "anst": "Domain Name System (DNS)"},
{"n": 33, "t": "What occurs during the \"Processing\" stage on the server?", "type": "mc", "opts": [{"l": "A", "t": "The browser compiles JavaScript"}, {"l": "B", "t": "The server interprets the request, locates static files, or executes code dynamically"}, {"l": "C", "t": "The client paints pixels to the screen"}, {"l": "D", "t": "The DNS maps IP addresses to local cache"}], "ans": "B", "anst": "The server interprets the request, locates static files, or executes code dynamically"},
{"n": 34, "t": "Which of the following backend languages may execute server-side code to generate dynamic HTML?", "type": "mc", "opts": [{"l": "A", "t": "Node.js, Python, or PHP"}, {"l": "B", "t": "CSS3"}, {"l": "C", "t": "HTML5"}, {"l": "D", "t": "Canvas API"}], "ans": "A", "anst": "Node.js, Python, or PHP"},
{"n": 35, "t": "What is formulated by the server once the requested resource is located or generated?", "type": "mc", "opts": [{"l": "A", "t": "An HTTP Request"}, {"l": "B", "t": "An HTTP Response"}, {"l": "C", "t": "A DNS Record"}, {"l": "D", "t": "A DOM Tree"}], "ans": "B", "anst": "An HTTP Response"},
{"n": 36, "t": "What code is included in an HTTP Response to indicate the outcome of the request?", "type": "mc", "opts": [{"l": "A", "t": "Port number"}, {"l": "B", "t": "Status code"}, {"l": "C", "t": "MAC address"}, {"l": "D", "t": "Hash checksum"}], "ans": "B", "anst": "Status code"},

{"n": 167, "t": "Why should comments be used sparingly and deliberately?", "type": "mc", "opts": [{"l": "A", "t": "Each comment reduces website rankings by 10%"}, {"l": "B", "t": "Code should be inherently clean and semantic; comments should explain complex sections, not obvious tags"}, {"l": "C", "t": "Comments cause screen readers to stutter"}, {"l": "D", "t": "Comments disable CSS stylesheets"}], "ans": "B", "anst": "Code should be inherently clean and semantic; comments should explain complex sections, not obvious tags"},
{"n": 168, "t": "What role does page loading speed play in SEO?", "type": "mc", "opts": [{"l": "A", "t": "It is completely disregarded by modern search engines"}, {"l": "B", "t": "Faster, cleaner, well-structured pages rank higher in search results"}, {"l": "C", "t": "Speed only matters for sites running Flash"}, {"l": "D", "t": "Slow speeds increase search impressions"}], "ans": "B", "anst": "Faster, cleaner, well-structured pages rank higher in search results"},
{"n": 169, "t": "What accessibility feature on the `<html>` element also aids international SEO?", "type": "mc", "opts": [{"l": "A", "t": "`class=\"ltr\"`"}, {"l": "B", "t": "`lang=\"[code]\"`"}, {"l": "C", "t": "`data-seo=\"true\"`"}, {"l": "D", "t": "`id=\"root\"`"}], "ans": "B", "anst": "`lang=\"[code]\"`"},
{"n": 170, "t": "Which of the following tags is an outdated stylistic element that modern semantic HTML avoids?", "type": "mc", "opts": [{"l": "A", "t": "`<font>`"}, {"l": "B", "t": "`<header>`"}, {"l": "C", "t": "`<main>`"}, {"l": "D", "t": "`<nav>`"}], "ans": "A", "anst": "`<font>`"},
{"n": 171, "t": "What non-semantic element was historically overused to build entire page layouts?", "type": "mc", "opts": [{"l": "A", "t": "`<p>`"}, {"l": "B", "t": "`<div>`"}, {"l": "C", "t": "`<span>`"}, {"l": "D", "t": "`<b>`"}], "ans": "B", "anst": "`<div>`"},
{"n": 172, "t": "Why is relying exclusively on `<div>` tags bad for accessibility and search engines?", "type": "mc", "opts": [{"l": "A", "t": "Divs cannot accept CSS styles"}, {"l": "B", "t": "A `<div>` conveys zero semantic meaning regarding its content or purpose"}, {"l": "C", "t": "Divs cause network packet corruption"}, {"l": "D", "t": "Divs fail to render on smartphone screens"}], "ans": "B", "anst": "A `<div>` conveys zero semantic meaning regarding its content or purpose"},
{"n": 173, "t": "What is the definition of Semantic HTML?", "type": "mc", "opts": [{"l": "A", "t": "Using tags that clearly describe their meaning and purpose to browsers, machines, and developers"}, {"l": "B", "t": "Compiling HTML markup into binary code"}, {"l": "C", "t": "Replacing text with vector images"}, {"l": "D", "t": "Writing inline CSS styling inside paragraph tags"}], "ans": "A", "anst": "Using tags that clearly describe their meaning and purpose to browsers, machines, and developers"},
{"n": 174, "t": "What is the primary semantic purpose of the `<header>` element?", "type": "mc", "opts": [{"l": "A", "t": "To display copyright links at the bottom of a page"}, {"l": "B", "t": "To serve as a container for introductory content, site titles, or navigational aids"}, {"l": "C", "t": "To declare the metadata inside `<head>`"}, {"l": "D", "t": "To define tabular row headers"}], "ans": "B", "anst": "To serve as a container for introductory content, site titles, or navigational aids"},
{"n": 175, "t": "Can a webpage contain more than one `<header>` element?", "type": "mc", "opts": [{"l": "A", "t": "No, only one is permitted per entire domain"}, {"l": "B", "t": "Yes, individual sections and `<article>` tags can have their own `<header>`"}, {"l": "C", "t": "Only if using an XHTML validator"}, {"l": "D", "t": "No, exactly one `<header>` is allowed per `<body>`"}], "ans": "B", "anst": "Yes, individual sections and `<article>` tags can have their own `<header>`"},
{"n": 176, "t": "What is the `<nav>` element specifically designed to contain?", "type": "mc", "opts": [{"l": "A", "t": "All hyperlinks appearing anywhere in the page body"}, {"l": "B", "t": "Major navigational blocks of links such as primary menus, pagination, or tables of contents"}, {"l": "C", "t": "External links pointing to social networks only"}, {"l": "D", "t": "Search engine tracking scripts"}], "ans": "B", "anst": "Major navigational blocks of links such as primary menus, pagination, or tables of contents"},
{"n": 177, "t": "How do assistive screen readers take advantage of the `<nav>` tag?", "type": "mc", "opts": [{"l": "A", "t": "They mute the speaker audio"}, {"l": "B", "t": "They recognize navigation landmarks, allowing users to jump directly to or skip over navigation"}, {"l": "C", "t": "They translate menu items into Latin"}, {"l": "D", "t": "They hide navigation links automatically"}], "ans": "B", "anst": "They recognize navigation landmarks, allowing users to jump directly to or skip over navigation"},
{"n": 178, "t": "Should every single hyperlink on a page be wrapped in a `<nav>` tag?", "type": "mc", "opts": [{"l": "A", "t": "Yes, all links require `<nav>`"}, {"l": "B", "t": "No, `<nav>` should be reserved for major navigation blocks"}, {"l": "C", "t": "Only footer links require `<nav>`"}, {"l": "D", "t": "Only image links require `<nav>`"}], "ans": "B", "anst": "No, `<nav>` should be reserved for major navigation blocks"},
{"n": 179, "t": "What does the `<main>` element identify?", "type": "mc", "opts": [{"l": "A", "t": "The primary, unique content of the document"}, {"l": "B", "t": "The top navigation bar"}, {"l": "C", "t": "The footer copyright notice"}, {"l": "D", "t": "The sidebar advertisements"}], "ans": "A", "anst": "The primary, unique content of the document"},
{"n": 180, "t": "How many `<main>` elements should be visible per webpage?", "type": "mc", "opts": [{"l": "A", "t": "Exactly one"}, {"l": "B", "t": "One for each section"}, {"l": "C", "t": "Up to five"}, {"l": "D", "t": "As many as needed for styling"}], "ans": "A", "anst": "Exactly one"},
{"n": 181, "t": "Where is the `<main>` element NOT allowed to be nested?", "type": "mc", "opts": [{"l": "A", "t": "Directly inside `<body>`"}, {"l": "B", "t": "Inside `<header>`, `<footer>`, `<nav>`, or `<aside>`"}, {"l": "C", "t": "Inside the standard HTML document"}, {"l": "D", "t": "Beside an `<aside>` element"}], "ans": "B", "anst": "Inside `<header>`, `<footer>`, `<nav>`, or `<aside>`"},
{"n": 182, "t": "What does the `<article>` element represent?", "type": "mc", "opts": [{"l": "A", "t": "A generic wrapper used only for applying CSS flexbox"}, {"l": "B", "t": "A self-contained, independent portion of content that could be distributed or reused on its own"}, {"l": "C", "t": "A small text disclaimer beneath an image"}, {"l": "D", "t": "An italicized quotation from a book"}], "ans": "B", "anst": "A self-contained, independent portion of content that could be distributed or reused on its own"},
{"n": 183, "t": "Which of the following is an ideal candidate for an `<article>` tag?", "type": "mc", "opts": [{"l": "A", "t": "A blog post, news story, forum thread, or product card"}, {"l": "B", "t": "A site-wide footer navigation bar"}, {"l": "C", "t": "A solitary horizontal divider line"}, {"l": "D", "t": "The page viewport meta tag"}], "ans": "A", "anst": "A blog post, news story, forum thread, or product card"},
{"n": 184, "t": "What does the `<section>` element define?", "type": "mc", "opts": [{"l": "A", "t": "A generic standalone section grouping related thematic content, typically with a heading"}, {"l": "B", "t": "An inline piece of highlighted text"}, {"l": "C", "t": "An external document embedded inside an iframe"}, {"l": "D", "t": "A single list item in a dropdown"}], "ans": "A", "anst": "A generic standalone section grouping related thematic content, typically with a heading"},
{"n": 185, "t": "When should you use `<article>` instead of `<section>`?", "type": "mc", "opts": [{"l": "A", "t": "When the content is purely decorative"}, {"l": "B", "t": "When the content is standalone, independent, and reusable outside the context of the page"}, {"l": "C", "t": "When grouping generic elements purely for layout margins"}, {"l": "D", "t": "When creating a sidebar"}], "ans": "B", "anst": "When the content is standalone, independent, and reusable outside the context of the page"},
{"n": 186, "t": "When is it appropriate to use a plain `<div>` rather than `<section>` or `<article>`?", "type": "mc", "opts": [{"l": "A", "t": "When grouping content that forms a distinct chapter of a book"}, {"l": "B", "t": "When the grouping is purely for visual styling or CSS layout scripting without semantic meaning"}, {"l": "C", "t": "When identifying the main heading of a webpage"}, {"l": "D", "t": "When defining navigation landmarks"}], "ans": "B", "anst": "When the grouping is purely for visual styling or CSS layout scripting without semantic meaning"},
{"n": 187, "t": "What does the `<aside>` element represent?", "type": "mc", "opts": [{"l": "A", "t": "The primary article text"}, {"l": "B", "t": "Content tangentially related to surrounding content, such as sidebars, callouts, or related links"}, {"l": "C", "t": "An off-screen hidden password input"}, {"l": "D", "t": "A mandatory footer container"}], "ans": "B", "anst": "Content tangentially related to surrounding content, such as sidebars, callouts, or related links"},
{"n": 188, "t": "What does the `<footer>` element define?", "type": "mc", "opts": [{"l": "A", "t": "The primary banner of the page"}, {"l": "B", "t": "A footer for its nearest sectioning ancestor or the page itself"}, {"l": "C", "t": "An input field for telephone numbers"}, {"l": "D", "t": "A table header cell"}], "ans": "B", "anst": "A footer for its nearest sectioning ancestor or the page itself"},
{"n": 189, "t": "What information commonly resides in a page-level `<footer>`?", "type": "mc", "opts": [{"l": "A", "t": "Main page `<h1>` headline"}, {"l": "B", "t": "Copyright notices, contact information, privacy policy links, and site maps"}, {"l": "C", "t": "Character encoding meta tags"}, {"l": "D", "t": "Inline SVG circle paths"}], "ans": "B", "anst": "Copyright notices, contact information, privacy policy links, and site maps"},
{"n": 190, "t": "What is a key benefit of replacing nested non-semantic divs with semantic layout elements?", "type": "mc", "opts": [{"l": "A", "t": "It makes the document structure immediately comprehensible to assistive technologies and search bots"}, {"l": "B", "t": "It halves the download size of all embedded raster images"}, {"l": "C", "t": "It compiles client-side code directly to C++"}, {"l": "D", "t": "It eliminates the need for any CSS styling"}], "ans": "A", "anst": "It makes the document structure immediately comprehensible to assistive technologies and search bots"},
{"n": 191, "t": "What common abbreviation is used to represent the term \"Accessibility\"?", "type": "mc", "opts": [{"l": "A", "t": "a11y"}, {"l": "B", "t": "acc10y"}, {"l": "C", "t": "access9"}, {"l": "D", "t": "a8y"}], "ans": "A", "anst": "a11y"},
{"n": 192, "t": "What is the core premise of Web Accessibility?", "type": "mc", "opts": [{"l": "A", "t": "Ensuring only mobile phone users can view web pages"}, {"l": "B", "t": "Making websites, tools, and technologies usable by everyone, including people with disabilities"}, {"l": "C", "t": "Requiring biometric logins on every web form"}, {"l": "D", "t": "Limiting website access to registered members"}], "ans": "B", "anst": "Making websites, tools, and technologies usable by everyone, including people with disabilities"},
{"n": 193, "t": "Assistive software that reads text and structural elements aloud to blind users is called a:", "type": "mc", "opts": [{"l": "A", "t": "Screen magnifier"}, {"l": "B", "t": "Screen reader"}, {"l": "C", "t": "Web spider"}, {"l": "D", "t": "Transpiler"}], "ans": "B", "anst": "Screen reader"},
{"n": 194, "t": "What accessible accommodations are needed for users with hearing impairments?", "type": "mc", "opts": [{"l": "A", "t": "Audio transcripts and video captions"}, {"l": "B", "t": "High-contrast monochrome palettes"}, {"l": "C", "t": "Default focus rings"}, {"l": "D", "t": "Keyboard-only switches"}], "ans": "A", "anst": "Audio transcripts and video captions"},
{"n": 195, "t": "How do users with motor or physical disabilities often navigate web content?", "type": "mc", "opts": [{"l": "A", "t": "Through keyboard-only navigation, sip-and-puff switches, or voice control"}, {"l": "B", "t": "Using high-speed optical mice only"}, {"l": "C", "t": "By disabling all form controls"}, {"l": "D", "t": "By listening to screen reader tone frequencies"}], "ans": "A", "anst": "Through keyboard-only navigation, sip-and-puff switches, or voice control"},
{"n": 196, "t": "How does clear semantic HTML structure benefit users with cognitive disabilities?", "type": "mc", "opts": [{"l": "A", "t": "It prevents browsers from downloading CSS"}, {"l": "B", "t": "It creates predictable interfaces, simple reading orders, and consistent layouts"}, {"l": "C", "t": "It hides long paragraphs from view"}, {"l": "D", "t": "It speeds up network server response times"}], "ans": "B", "anst": "It creates predictable interfaces, simple reading orders, and consistent layouts"},
{"n": 197, "t": "Why are semantic heading tags (`<h1>`-`<h6>`) crucial for screen reader users?", "type": "mc", "opts": [{"l": "A", "t": "Screen reader users frequently navigate pages by jumping from heading to heading to build a mental outline"}, {"l": "B", "t": "Headings are the only elements that screen readers can pronounce"}, {"l": "C", "t": "Headings automatically enable computer microphones"}, {"l": "D", "t": "Headings bypass client-side validation"}], "ans": "A", "anst": "Screen reader users frequently navigate pages by jumping from heading to heading to build a mental outline"},
{"n": 198, "t": "What do landmark elements like `<nav>`, `<main>`, and `<footer>` allow assistive tech users to do?", "type": "mc", "opts": [{"l": "A", "t": "Jump quickly between major functional regions of the page"}, {"l": "B", "t": "Change browser fonts to bold"}, {"l": "C", "t": "Download offline databases"}, {"l": "D", "t": "Bypass HTTP security certificates"}], "ans": "A", "anst": "Jump quickly between major functional regions of the page"},
{"n": 199, "t": "What does the acronym ARIA stand for in web accessibility?", "type": "mc", "opts": [{"l": "A", "t": "Automated Responsive Internet Applications"}, {"l": "B", "t": "Accessible Rich Internet Applications"}, {"l": "C", "t": "Asynchronous Rendering Interface Architecture"}, {"l": "D", "t": "Advanced Rendering Integration Array"}], "ans": "B", "anst": "Accessible Rich Internet Applications"},
{"n": 200, "t": "When should ARIA attributes primarily be utilized?", "type": "mc", "opts": [{"l": "A", "t": "As a total replacement for all native HTML elements"}, {"l": "B", "t": "When building complex custom UI widgets that lack native HTML semantic equivalents"}, {"l": "C", "t": "Exclusively for embedding vector graphics"}, {"l": "D", "t": "To force CSS styles to override browser defaults"}], "ans": "B", "anst": "When building complex custom UI widgets that lack native HTML semantic equivalents"},
{"n": 201, "t": "What visual accessibility requirement relates to text visibility against its background?", "type": "mc", "opts": [{"l": "A", "t": "Sufficient color contrast"}, {"l": "B", "t": "Maximum font weight"}, {"l": "C", "t": "Dynamic text rotation"}, {"l": "D", "t": "Absolute positioning"}], "ans": "A", "anst": "Sufficient color contrast"},
{"n": 202, "t": "Why is removing the default browser `:focus` ring with `outline: none` considered poor practice?", "type": "mc", "opts": [{"l": "A", "t": "It breaks image links"}, {"l": "B", "t": "Keyboard-only users lose visual track of which element is currently active or focused"}, {"l": "C", "t": "It triggers Quirks Mode in Chrome"}, {"l": "D", "t": "It converts links into plain text"}], "ans": "B", "anst": "Keyboard-only users lose visual track of which element is currently active or focused"},
{"n": 203, "t": "Why should generic link text like \"Click Here\" or \"Read More\" be avoided?", "type": "mc", "opts": [{"l": "A", "t": "Screen reader users listening to an extracted list of links receive zero context about the link destination"}, {"l": "B", "t": "Search engines treat \"Click Here\" as a malicious virus trigger"}, {"l": "C", "t": "Hyperlinks must not contain English verbs"}, {"l": "D", "t": "Modern browsers refuse to execute navigation on generic phrases"}], "ans": "A", "anst": "Screen reader users listening to an extracted list of links receive zero context about the link destination"},
{"n": 204, "t": "What is the accessible way to structure a hyperlink's text?", "type": "mc", "opts": [{"l": "A", "t": "Use the raw destination URL as the link text"}, {"l": "B", "t": "Use meaningful, descriptive phrases indicating where the link leads"}, {"l": "C", "t": "Use single numbers like \"1\", \"2\", \"3\""}, {"l": "D", "t": "Leave the link text blank and add an image"}], "ans": "B", "anst": "Use meaningful, descriptive phrases indicating where the link leads"},
{"n": 205, "t": "Embedding accessibility into the HTML foundation from the start results in:", "type": "mc", "opts": [{"l": "A", "t": "Slower load times and clunky layouts"}, {"l": "B", "t": "A better, more robust user experience for all users"}, {"l": "C", "t": "The complete deprecation of CSS"}, {"l": "D", "t": "Incompatibility with legacy search bots"}], "ans": "B", "anst": "A better, more robust user experience for all users"},
{"n": 206, "t": "What is the primary role of HTML forms on the web?", "type": "mc", "opts": [{"l": "A", "t": "Displaying non-interactive tabular records"}, {"l": "B", "t": "Providing the primary mechanism for users to send information to a web server"}, {"l": "C", "t": "Playing back audio and video streams"}, {"l": "D", "t": "Linking external CSS stylesheets"}], "ans": "B", "anst": "Providing the primary mechanism for users to send information to a web server"},
{"n": 207, "t": "Which tag wraps all form controls and attributes for submission?", "type": "mc", "opts": [{"l": "A", "t": "`<input>`"}, {"l": "B", "t": "`<form>`"}, {"l": "C", "t": "`<fieldset>`"}, {"l": "D", "t": "`<submit>`"}], "ans": "B", "anst": "`<form>`"},
{"n": 208, "t": "What does the `action` attribute on a `<form>` element specify?", "type": "mc", "opts": [{"l": "A", "t": "The client-side animation applied on click"}, {"l": "B", "t": "The destination URL (server script or API endpoint) where form data is sent"}, {"l": "C", "t": "The database password of the web server"}, {"l": "D", "t": "The CSS transition state"}], "ans": "B", "anst": "The destination URL (server script or API endpoint) where form data is sent"},
{"n": 209, "t": "What does the `method` attribute on a `<form>` define?", "type": "mc", "opts": [{"l": "A", "t": "The HTTP method used to transfer data (e.g., GET or POST)"}, {"l": "B", "t": "The programming language used on the server"}, {"l": "C", "t": "The font rendering engine"}, {"l": "D", "t": "The character set encoding"}], "ans": "A", "anst": "The HTTP method used to transfer data (e.g., GET or POST)"},
{"n": 210, "t": "How does the `GET` method transmit form data?", "type": "mc", "opts": [{"l": "A", "t": "Encrypted in binary within the network layer"}, {"l": "B", "t": "Appended directly to the URL as visible query parameters"}, {"l": "C", "t": "Hidden inside the HTTP request body payload"}, {"l": "D", "t": "Stored permanently in browser cookies"}], "ans": "B", "anst": "Appended directly to the URL as visible query parameters"},
{"n": 211, "t": "When is the `GET` method appropriate for form submission?", "type": "mc", "opts": [{"l": "A", "t": "When submitting passwords and credit card details"}, {"l": "B", "t": "For non-sensitive data queries such as searches or data filtering"}, {"l": "C", "t": "When uploading multi-gigabyte media files"}, {"l": "D", "t": "When altering database records permanently"}], "ans": "B", "anst": "For non-sensitive data queries such as searches or data filtering"},
{"n": 212, "t": "How does the `POST` method transmit form data to the server?", "type": "mc", "opts": [{"l": "A", "t": "In the address bar query string"}, {"l": "B", "t": "Inside the HTTP request body (not visible in the URL)"}, {"l": "C", "t": "Through DNS record modifications"}, {"l": "D", "t": "As plain text comments in the HTML head"}], "ans": "B", "anst": "Inside the HTTP request body (not visible in the URL)"},
{"n": 213, "t": "When MUST the `POST` method be preferred over `GET`?", "type": "mc", "opts": [{"l": "A", "t": "When transmitting sensitive data (passwords) or submitting large volumes of data"}, {"l": "B", "t": "When running a simple Wikipedia keyword search"}, {"l": "C", "t": "When navigating between static pages"}, {"l": "D", "t": "When linking an external stylesheet"}], "ans": "A", "anst": "When transmitting sensitive data (passwords) or submitting large volumes of data"},
{"n": 214, "t": "What element provides text labels for interactive form controls?", "type": "mc", "opts": [{"l": "A", "t": "`<label>`"}, {"l": "B", "t": "`<span>`"}, {"l": "C", "t": "`<caption>`"}, {"l": "D", "t": "`<legend>`"}], "ans": "A", "anst": "`<label>`"},
{"n": 215, "t": "Why is the `<label>` element non-negotiable for accessibility?", "type": "mc", "opts": [{"l": "A", "t": "Browsers refuse to submit forms that lack labels"}, {"l": "B", "t": "Screen readers announce the label when the control receives focus, and clicking the label focuses the control"}, {"l": "C", "t": "Labels automatically encrypt form inputs"}, {"l": "D", "t": "Labels replace the need for input names"}], "ans": "B", "anst": "Screen readers announce the label when the control receives focus, and clicking the label focuses the control"},
{"n": 216, "t": "How is an explicit programmatic association made between a `<label>` and an `<input>`?", "type": "mc", "opts": [{"l": "A", "t": "Matching the label's `for` attribute to the input's `id` attribute"}, {"l": "B", "t": "Giving them the exact same `class` name"}, {"l": "C", "t": "Matching the label's `name` to the input's `value`"}, {"l": "D", "t": "Placing them in separate tables"}], "ans": "A", "anst": "Matching the label's `for` attribute to the input's `id` attribute"},
{"n": 217, "t": "What happens when a user clicks on an accessible `<label>` associated with a checkbox?", "type": "mc", "opts": [{"l": "A", "t": "The page reloads immediately"}, {"l": "B", "t": "The corresponding checkbox toggles its checked state"}, {"l": "C", "t": "The form submits to the server"}, {"l": "D", "t": "The text is highlighted in red"}], "ans": "B", "anst": "The corresponding checkbox toggles its checked state"},
{"n": 218, "t": "Which versatile HTML tag creates various controls based on its `type` attribute?", "type": "mc", "opts": [{"l": "A", "t": "`<control>`"}, {"l": "B", "t": "`<input>`"}, {"l": "C", "t": "`<form>`"}, {"l": "D", "t": "`<button>`"}], "ans": "B", "anst": "`<input>`"},
{"n": 219, "t": "What is the default control created by `<input>` if the `type` attribute is omitted?", "type": "mc", "opts": [{"l": "A", "t": "`type=\"checkbox\"`"}, {"l": "B", "t": "`type=\"text\"`"}, {"l": "C", "t": "`type=\"submit\"`"}, {"l": "D", "t": "`type=\"radio\"`"}], "ans": "B", "anst": "`type=\"text\"`"},
{"n": 220, "t": "What input type masks characters with dots or asterisks for security?", "type": "mc", "opts": [{"l": "A", "t": "`type=\"mask\"`"}, {"l": "B", "t": "`type=\"password\"`"}, {"l": "C", "t": "`type=\"secret\"`"}, {"l": "D", "t": "`type=\"hidden\"`"}], "ans": "B", "anst": "`type=\"password\"`"},
{"n": 221, "t": "What input type provides automatic client-side format validation for email addresses?", "type": "mc", "opts": [{"l": "A", "t": "`type=\"text\"`"}, {"l": "B", "t": "`type=\"email\"`"}, {"l": "C", "t": "`type=\"mail\"`"}, {"l": "D", "t": "`type=\"address\"`"}], "ans": "B", "anst": "`type=\"email\"`"},
{"n": 222, "t": "What input type restricts data entry to numbers and can display numeric spinner arrows?", "type": "mc", "opts": [{"l": "A", "t": "`type=\"number\"`"}, {"l": "B", "t": "`type=\"digit\"`"}, {"l": "C", "t": "`type=\"calc\"`"}, {"l": "D", "t": "`type=\"integer\"`"}], "ans": "A", "anst": "`type=\"number\"`"},
{"n": 223, "t": "What input type allows users to select zero, one, or multiple independent choices from a list?", "type": "mc", "opts": [{"l": "A", "t": "`type=\"radio\"`"}, {"l": "B", "t": "`type=\"checkbox\"`"}, {"l": "C", "t": "`type=\"select\"`"}, {"l": "D", "t": "`type=\"toggle\"`"}], "ans": "B", "anst": "`type=\"checkbox\"`"},

const quizContainer = document.querySelector(".quiz-container");
const resultContainer = document.querySelector(".quiz-result");
const timerDisplay = document.querySelector(".quiz-container .timer");
const questionEl = document.querySelector(".quiz-container .question");
const optionsEl = document.querySelector(".quiz-container .options");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const fibRow = document.getElementById("fibRow");
const fibInput = document.getElementById("fibInput");
const fibSubmit = document.getElementById("fibSubmit");

const MAX_QUESTIONS = QUESTIONS.length;
const SECONDS_PER_QUESTION = 15;
const TEST_DURATION = MAX_QUESTIONS * SECONDS_PER_QUESTION;

let active = [];
let questionNumber = 0;
let score = 0;
let timeLeft = 0;
let timerInterval;

const shuffleArray = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
}[c]));

const resetLocalStorage = () => {
    for (let i = 0; i < MAX_QUESTIONS; i++) {
        localStorage.removeItem(`userAnswer_${i}`);
    }
};

function correctText(q) {
    if (q.type === "mc") {
        const o = q.opts.find(x => x.l === q.ans);
        return o ? o.t : q.anst;
    }
    if (q.type === "tf") return q.ans;
    return q.anst;
}

function fibMatch(input, ans) {
    const ni = norm(input);
    if (!ni) return false;
    const candidates = [ans, ans.replace(/\([^)]*\)/g, "").trim()];
    ans.split(/[;,]/).forEach(p => {
        const t = p.trim().replace(/\([^)]*\)/g, "").trim();
        if (t) candidates.push(t);
    });
    return candidates.some(c => c && norm(c) === ni);
}
function norm(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function isCorrect(q, userText) {
    if (!userText) return false;
    const t = String(userText).trim();
    if (q.type === "fib") return fibMatch(t, q.anst);
    return t === correctText(q);
}

const formatTime = seconds => {
    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
};

const updateTimerDisplay = () => {
    timerDisplay.textContent = `Time Left: ${formatTime(timeLeft)}`;
    timerDisplay.classList.toggle("danger", timeLeft <= 300);
};

const startTestTimer = () => {
    clearInterval(timerInterval);
    timeLeft = TEST_DURATION;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            timeLeft = 0;
            updateTimerDisplay();
            clearInterval(timerInterval);
            displayQuizResult();
            return;
        }
        updateTimerDisplay();
    }, 1000);
};

function checkAnswer(userAnswer, el) {
    const q = active[questionNumber];
    const correct = correctText(q);
    const ok = isCorrect(q, userAnswer);

    if (ok) {
        score++;
        el.classList.add("correct");
        celebrateAnswer(el);
    } else {
        el.classList.add("incorrect");
    }

    localStorage.setItem(`userAnswer_${questionNumber}`, String(userAnswer).trim());

    const allOptions = document.querySelectorAll(".quiz-container .option");
    allOptions.forEach(o => o.classList.add("disabled"));
    fibInput.disabled = true;
    fibSubmit.disabled = true;

    if (!ok) {
        allOptions.forEach(o => {
            if (o.textContent.trim() === correct) o.classList.add("correct");
        });
    }
}

function celebrateAnswer(el) {
    if (!el || el.tagName === "INPUT") return;

    const badge = document.createElement("span");
    badge.className = "celebrate";
    badge.innerHTML = 'AWESOME <span class="cracker-emoji">🎉</span>';
    el.appendChild(badge);

    const crackers = document.createElement("span");
    crackers.className = "crackers";
    crackers.textContent = "🎆 🎇 ✨";
    el.appendChild(crackers);

    const emojis = ["🎉", "🎊", "🎆", "🎇", "✨", "💥"];
    for (let i = 0; i < 18; i++) {
        const c = document.createElement("span");
        c.className = "confetti";
        c.textContent = emojis[i % emojis.length];
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = (1.4 + Math.random() * 1.6) + "s";
        c.style.fontSize = (14 + Math.random() * 18) + "px";
        c.style.animationDelay = (Math.random() * 0.5) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3500);
    }
}

function buildOptions(q, savedUser) {
    optionsEl.innerHTML = "";
    fibRow.classList.add("hidden");
    optionsEl.classList.remove("hidden");

    const correct = correctText(q);
    const locked = savedUser != null;
    const qs = q.type === "tf" ? shuffleArray(["True", "False"]) : shuffleArray(q.opts.map(o => o.t));

    qs.forEach(o => {
        const option = document.createElement("button");
        option.classList.add("option");
        option.textContent = o;
        if (locked) {
            option.classList.add("disabled");
            if (o === correct) option.classList.add("correct");
            if (o === String(savedUser).trim() && o !== correct) option.classList.add("incorrect");
        } else {
            option.addEventListener("click", () => checkAnswer(o, option));
        }
        optionsEl.appendChild(option);
    });
}

function buildFib(q, savedUser) {
    optionsEl.classList.add("hidden");
    fibRow.classList.remove("hidden");
    fibInput.classList.remove("correct", "incorrect");
    fibInput.value = savedUser != null ? savedUser : "";

    if (savedUser != null) {
        fibInput.disabled = true;
        fibSubmit.disabled = true;
        fibInput.classList.add(isCorrect(q, savedUser) ? "correct" : "incorrect");
    } else {
        fibInput.disabled = false;
        fibSubmit.disabled = false;
        fibInput.focus();
    }
}

function createQuestion() {
    optionsEl.innerHTML = "";
    const q = active[questionNumber];
    const savedUser = localStorage.getItem(`userAnswer_${questionNumber}`);
    const tq = q.t.replace(/^True\/False:\s*/, "");

    questionEl.textContent = "";
    const badge = document.createElement("span");
    badge.className = "question-number";
    badge.textContent = `${questionNumber + 1}/${MAX_QUESTIONS}`;
    questionEl.appendChild(badge);
    questionEl.appendChild(document.createTextNode(" " + tq));

    if (q.type === "fib") {
        buildFib(q, savedUser);
    } else {
        buildOptions(q, savedUser);
    }

    nextBtn.textContent = questionNumber >= MAX_QUESTIONS - 1 ? "Finish" : "Next";
    prevBtn.disabled = questionNumber === 0;
}

fibSubmit.addEventListener("click", () => {
    if (!fibInput.disabled) {
        const val = fibInput.value.trim();
        if (!val) { fibInput.focus(); return; }
        checkAnswer(val, fibInput);
        if (isCorrect(active[questionNumber], val)) fibInput.classList.add("correct");
        else fibInput.classList.add("incorrect");
    }
});
fibInput.addEventListener("keydown", e => {
    if (e.key === "Enter") fibSubmit.click();
});

const displayNextQuestion = () => {
    if (questionNumber >= MAX_QUESTIONS - 1) {
        displayQuizResult();
        return;
    }
    questionNumber++;
    createQuestion();
};
nextBtn.addEventListener("click", displayNextQuestion);

const displayPrevQuestion = () => {
    if (questionNumber > 0) {
        questionNumber--;
        createQuestion();
    }
};
prevBtn.addEventListener("click", displayPrevQuestion);

const getResultMessage = () => {
    const pct = score / MAX_QUESTIONS;
    if (pct === 1) return "Outstanding! Perfect score.";
    if (pct >= 0.75) return "Very good.";
    if (pct >= 0.5) return "Good. Keep practising the weak spots.";
    if (pct >= 0.25) return "Do hard work — revisit the review list below.";
    return "Better luck next time.";
};

const displayQuizResult = () => {
    clearInterval(timerInterval);
    resultContainer.style.display = "flex";
    quizContainer.style.display = "none";
    resultContainer.innerHTML = "";

    const heading = document.createElement("h2");
    heading.innerHTML = `You have scored ${score} out of ${MAX_QUESTIONS}.`;
    resultContainer.appendChild(heading);

    const msg = document.createElement("h3");
    msg.innerHTML = getResultMessage();
    resultContainer.appendChild(msg);

    const legend = document.createElement("div");
    legend.className = "result-legend";
    legend.innerHTML = '<span><span class="dot g"></span> Correct</span><span><span class="dot r"></span> Wrong</span><span><span class="dot w"></span> Not answered</span>';
    resultContainer.appendChild(legend);

    for (let i = 0; i < MAX_QUESTIONS; i++) {
        const q = active[i];
        const userAnswer = localStorage.getItem(`userAnswer_${i}`);
        const attempted = !!(userAnswer && userAnswer.trim());
        const ok = isCorrect(q, userAnswer);

        const item = document.createElement("div");
        item.classList.add("question-container");
        if (ok) item.classList.add("correct-item");
        else if (attempted) item.classList.add("incorrect-item");

        const showQ = q.t.replace(/^True\/False:\s*/, "");
        const userText = attempted ? userAnswer.trim() : "Not answered";
        const ansClass = ok ? "good" : (attempted ? "bad" : "muted");
        const ansLine = `<div class="correct-answer">Correct answer: ${esc(correctText(q))}</div>`;

        item.innerHTML = `
            <div class="question"><span class="qno">Q${q.n}</span>${esc(showQ)}</div>
            <div class="user-answer ${ansClass}">Your answer: ${esc(userText)}</div>
            ${ansLine}`;

        resultContainer.appendChild(item);
    }

    const retakeBtn = document.createElement("button");
    retakeBtn.classList.add("retake-btn");
    retakeBtn.innerHTML = "Retake Quiz";
    retakeBtn.addEventListener("click", retakeQuiz);
    resultContainer.appendChild(retakeBtn);

    window.scrollTo({ top: 0 });
};

const retakeQuiz = () => {
    questionNumber = 0;
    score = 0;
    active = shuffleArray(active);
    resetLocalStorage();

    startTestTimer();
    createQuestion();
    resultContainer.style.display = "none";
    quizContainer.style.display = "block";
    window.scrollTo({ top: 0 });
};

active = shuffleArray(QUESTIONS);
resetLocalStorage();
startTestTimer();
createQuestion();
</script>
</body>
</html>
